name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # NOTE: `brew install sparkle` installs the Sparkle Test App (a cask), not the
      # sign_update/generate_appcast CLI tools, and the cask is deprecated anyway.
      # Download the official prebuilt tools archive instead, version-matched to the
      # Sparkle submodule (see JgDo.xcodeproj/project.xcworkspace/.../Package.resolved).
      - name: Install Sparkle CLI tools
        run: |
          curl -L -o sparkle-tools.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz
          mkdir -p sparkle-tools
          tar -xf sparkle-tools.tar.xz -C sparkle-tools
          sparkle-tools/bin/generate_appcast --help >/dev/null

      - name: Show Xcode version
        run: xcodebuild -version

      # NOTE: This project is on a free Apple Developer "Personal Team", which cannot
      # issue a "Developer ID Application" certificate (that requires the paid Apple
      # Developer Program). Until enrolled, we build and self-sign (ad-hoc) instead of
      # using a Developer ID cert + notarization. Ad-hoc-signed apps are NOT notarized,
      # so first-time users will see a Gatekeeper warning and need to right-click > Open
      # (or run `xattr -cr JgDo.app`) to launch.
      #
      # Sparkle compares CFBundleVersion (CURRENT_PROJECT_VERSION), NOT the marketing
      # version string, to decide whether an update is "newer". Driving it from
      # github.run_number guarantees every release build number is strictly greater
      # than the last, so in-app "Check for Updates" always finds new releases without
      # anyone having to remember to hand-bump a build number. MARKETING_VERSION comes
      # straight from the pushed tag so the display version always matches the tag.
      - name: Build and Archive (ad-hoc signed)
        run: |
          xcodebuild \
            -project JgDo.xcodeproj \
            -scheme JgDo \
            -configuration Release \
            -archivePath build/JgDo.xcarchive \
            -allowProvisioningUpdates \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export app from archive
        run: |
          mkdir -p build/export
          cp -R "build/JgDo.xcarchive/Products/Applications/JgDo.app" build/export/
          # Re-sign ad-hoc (deep) to ensure all nested frameworks/bundles are signed consistently.
          codesign --force --deep --sign - build/export/JgDo.app
          codesign --verify --deep --strict --verbose=2 build/export/JgDo.app

      # generate_appcast (below) reads every archive out of one directory, so the DMG
      # has to live there before we run it.
      #
      # -srcfolder pointed straight at JgDo.app before, which puts only the app
      # in the mounted volume — no Applications shortcut to drag onto, so the
      # classic drag-to-install gesture didn't work. Stage a folder with both
      # the app and an /Applications symlink instead.
      - name: Create DMG
        run: |
          mkdir -p build/updates build/dmg-root
          cp -R build/export/JgDo.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "JgDo" \
            -srcfolder build/dmg-root \
            -ov -format UDZO \
            build/updates/JgDo-${{ github.ref_name }}.dmg

      # Sparkle 2.x's generate_appcast signs each archive itself (no separate
      # sign_update step) and infers version + minimum OS straight from the app's
      # Info.plist inside the DMG. The key is piped in via stdin so it never touches
      # disk or a `run:` argv where it could leak into logs.
      # NOTE: no --channel flag here. The app's SparkleDelegateProxy.allowedChannels()
      # only ever returns {} or {"beta"} — it treats "no channel tag" as the stable
      # channel and filters out anything else (Sparkle's SUAppcastDriver drops any item
      # whose <sparkle:channel> isn't in allowedChannels). Passing --channel "stable"
      # here tagged every release "stable", which is never an allowed channel, so every
      # release was silently invisible to "Check for Updates" regardless of version.
      - name: Generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            build/updates/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/updates/JgDo-${{ github.ref_name }}.dmg
            build/updates/appcast.xml
          generate_release_notes: true
          draft: false
          prerelease: false

      # Keeps the `brew install --cask jgdo` command on the download page
      # actually working. Needs a fine-grained PAT with contents:write on
      # sovandara1607/homebrew-jgdo, stored as the HOMEBREW_TAP_TOKEN secret —
      # the default GITHUB_TOKEN can't push to a different repo. Skips quietly
      # (rather than failing the release) if that secret isn't set yet.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # `secrets.*` can't be referenced in a step-level `if:` (GitHub
          # Actions rejects it as an unrecognized named-value there), so the
          # skip-when-unset check has to live in the script instead.
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew tap update."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 "build/updates/JgDo-${{ github.ref_name }}.dmg" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sovandara1607/homebrew-jgdo.git" tap
          cd tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/jgdo.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/jgdo.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/jgdo.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "chore: bump jgdo cask to v${VERSION}"
            git push origin main
          fi
