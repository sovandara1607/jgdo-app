name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Sparkle tools
        run: |
          brew install sparkle

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import code signing certificates
        uses: apple-actions/import-codesign-certs@v4
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Build and Archive
        run: |
          xcodebuild \
            -project JgDo.xcodeproj \
            -scheme JgDo \
            -configuration Release \
            -archivePath build/JgDo.xcarchive \
            -allowProvisioningUpdates \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export Notarized App
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/JgDo.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist JgDo/ExportOptions.plist

      - name: Create DMG
        run: |
          hdiutil create -volname "JgDo" \
            -srcfolder build/export/JgDo.app \
            -ov -format UDZO \
            build/JgDo-${{ github.ref_name }}.dmg

      - name: Sign DMG with Sparkle
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGNATURE=$(JgDo/External/Sparkle/bin/sign_update -f build/JgDo-${{ github.ref_name }}.dmg -p "$SPARKLE_PRIVATE_KEY" 2>&1 | tail -1)
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

      - name: Generate appcast.xml
        run: |
          JgDo/External/Sparkle/bin/generate_appcast \
            --output build/appcast.xml \
            --download-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            --version "${{ github.ref_name }}" \
            --signature "${{ steps.sign.outputs.signature }}" \
            --minimum-system-version 14.0 \
            --channel "stable" \
            build/JgDo-${{ github.ref_name }}.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/JgDo-${{ github.ref_name }}.dmg
            build/appcast.xml
          generate_release_notes: true
          draft: false
          prerelease: false